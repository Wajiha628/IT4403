</header>

<main>
    <div class="book-container" id="book-container">
        <p>Loading book information...</p>
    </div>
</main>

<footer>
    <p>Open Library Book Project</p>
</footer>

<script>
    $(document).ready(function () {

        $.getJSON("openlibrary-book.json")
            .done(function (book) {

                let title = book.title || "Not available";
                let publisher = "Not available";
                let publicationDate = book.publish_date || "Not available";
                let pageCount = book.number_of_pages || "Not available";
                let isbn10 = "Not available";
                let isbn13 = "Not available";
                let authors = "Not available";
                let firstSentence = "Not available";

                // Publishers
                if (book.publishers && book.publishers.length > 0) {
                    publisher = book.publishers.join(", ");
                }

                // ISBN-10
                if (book.isbn_10 && book.isbn_10.length > 0) {
                    isbn10 = book.isbn_10.join(", ");
                }

                // ISBN-13
                if (book.isbn_13 && book.isbn_13.length > 0) {
                    isbn13 = book.isbn_13.join(", ");
                }

                // Authors
                if (book.authors && book.authors.length > 0) {
                    let authorNames = [];

                    $.each(book.authors, function (index, author) {
                        if (author.name) {
                            authorNames.push(author.name);
                        } else if (author.key) {
                            authorNames.push(author.key);
                        }
                    });

                    if (authorNames.length > 0) {
                        authors = authorNames.join(", ");
                    }
                }

                // First sentence
                if (book.first_sentence) {
                    if (typeof book.first_sentence === "string") {
                        firstSentence = book.first_sentence;
                    } else if (book.first_sentence.value) {
                        firstSentence = book.first_sentence.value;
                    }
                }

                // Cover
                let coverHTML = "<p>Cover image not available.</p>";

                if (book.covers && book.covers.length > 0) {
                    let coverID = book.covers[0];

                    coverHTML =
                        '<img src="https://covers.openlibrary.org/b/id/' +
                        coverID +
                        '-L.jpg" alt="Cover of ' +
                        title.replace(/"/g, '&quot;') +
                        '">';
                }

                // Open Library link
                let openLibraryLink = "#";

                if (book.key) {
                    openLibraryLink = "https://openlibrary.org" + book.key;
                }

                let html = `
                    <div class="book-content">

                        <div class="cover-section">
                            ${coverHTML}
                        </div>

                        <div class="info-section">
                            <h1>${title}</h1>

                            <div class="info-item">
                                <span class="label">Author:</span>
                                ${authors}
                            </div>

                            <div class="info-item">
                                <span class="label">Publisher:</span>
                                ${publisher}
                            </div>

                            <div class="info-item">
                                <span class="label">Publication Date:</span>
                                ${publicationDate}
                            </div>

                            <div class="info-item">
                                <span class="label">Page Count:</span>
                                ${pageCount}
                            </div>

                            <div class="info-item">
                                <span class="label">ISBN-10:</span>
                                ${isbn10}
                            </div>

                            <div class="info-item">
                                <span class="label">ISBN-13:</span>
                                ${isbn13}
                            </div>

                            <div class="metadata">
                                <h2>First Sentence</h2>
                                <p>${firstSentence}</p>
                            </div>

                            ${
                                openLibraryLink !== "#"
                                ? `<a class="open-library-link"
                                      href="${openLibraryLink}"
                                      target="_blank"
                                      rel="noopener noreferrer">
                                      View on Open Library
                                   </a>`
                                : ""
                            }

                        </div>
                    </div>
                `;

                $("#book-container").html(html);
            })

            .fail(function () {
                $("#book-container").html(
                    '<p class="error">Unable to load the book information.</p>'
                );
            });
    });
</script>

</body>
</html>
